<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.addEventListener('error', function(e) {
        if(document.body) {
          document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:99999;background:red;color:white;padding:10px;">' + e.message + '<br>' + e.filename + ':' + e.lineno + '</div>';
        } else {
          alert('Error: ' + e.message);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if(document.body) {
          document.body.innerHTML += '<div style="position:fixed;top:50px;left:0;z-index:99999;background:red;color:white;padding:10px;">Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>';
        } else {
          alert('Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        }
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>手语教学平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
