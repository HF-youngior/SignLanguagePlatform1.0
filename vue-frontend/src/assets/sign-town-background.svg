<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- 背景层 - 柔焦效果 -->
  <defs>
    <!-- 模糊滤镜 -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <!-- 渐变定义 -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f5e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e6d2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="streetGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e6d9c3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d9c6a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6d9c3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9e6c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d4b0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e6d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6d9c3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 天空背景 -->
  <rect width="1200" height="800" fill="url(#skyGradient)" />
  
  <!-- 远处社区建筑轮廓 -->
  <g opacity="0.6" filter="url(#blur)">
    <rect x="100" y="200" width="150" height="200" fill="#f0e6d2" />
    <rect x="300" y="180" width="120" height="220" fill="#f9e6c9" />
    <rect x="800" y="190" width="180" height="210" fill="#f0e6d2" />
    <rect x="1000" y="210" width="100" height="190" fill="#f9e6c9" />
    <!-- 窗户 -->
    <rect x="120" y="230" width="20" height="20" fill="#f0d4b0" />
    <rect x="150" y="230" width="20" height="20" fill="#f0d4b0" />
    <rect x="120" y="270" width="20" height="20" fill="#f0d4b0" />
    <rect x="150" y="270" width="20" height="20" fill="#f0d4b0" />
    <rect x="320" y="210" width="15" height="15" fill="#f0d4b0" />
    <rect x="345" y="210" width="15" height="15" fill="#f0d4b0" />
    <rect x="820" y="220" width="20" height="20" fill="#f0d4b0" />
    <rect x="850" y="220" width="20" height="20" fill="#f0d4b0" />
    <rect x="880" y="220" width="20" height="20" fill="#f0d4b0" />
  </g>
  
  <!-- 蜿蜒街道 -->
  <path d="M0,600 Q300,550 600,600 Q900,650 1200,600" stroke="url(#streetGradient)" stroke-width="300" fill="none" />
  
  <!-- 篇章一：社区公园与咖啡馆（画面中下部） -->
  <g transform="translate(200, 500)" filter="url(#blur)">
    <!-- 公园区域 -->
    <rect x="-100" y="50" width="300" height="200" fill="#e6f0d2" />
    
    <!-- 公园长椅 -->
    <rect x="0" y="150" width="80" height="10" fill="#d9b38c" />
    <rect x="10" y="120" width="10" height="40" fill="#d9b38c" />
    <rect x="70" y="120" width="10" height="40" fill="#d9b38c" />
    
    <!-- 两个人用手语聊天 -->
    <!-- 人物1 -->
    <circle cx="30" cy="110" r="15" fill="#f0d4b0" />
    <rect x="25" y="125" width="10" height="20" fill="#f0d4b0" />
    <rect x="20" y="125" width="5" height="15" fill="#f0d4b0" />
    <rect x="35" y="125" width="5" height="15" fill="#f0d4b0" />
    <!-- 人物1的手 - 比出"3"的手势 -->
    <path d="M35,135 Q40,140 45,135" stroke="#f0d4b0" stroke-width="2" fill="none" />
    <path d="M45,135 Q50,145 55,135" stroke="#f0d4b0" stroke-width="2" fill="none" />
    <path d="M55,135 Q60,145 65,135" stroke="#f0d4b0" stroke-width="2" fill="none" />
    
    <!-- 人物2 -->
    <circle cx="70" cy="110" r="15" fill="#f0d4b0" />
    <rect x="65" y="125" width="10" height="20" fill="#f0d4b0" />
    <rect x="60" y="125" width="5" height="15" fill="#f0d4b0" />
    <rect x="75" y="125" width="5" height="15" fill="#f0d4b0" />
    
    <!-- 日历牌 -->
    <rect x="-80" y="80" width="40" height="60" fill="#ffffff" stroke="#d9b38c" stroke-width="2" />
    <text x="-60" y="105" font-size="12" text-anchor="middle" fill="#666666">日期</text>
    <!-- 手势图标 -->
    <path d="M-60,120 Q-55,125 -50,120" stroke="#666666" stroke-width="1" fill="none" />
    <path d="M-50,120 Q-45,130 -40,120" stroke="#666666" stroke-width="1" fill="none" />
    
    <!-- 咖啡馆 -->
    <rect x="150" y="30" width="120" height="100" fill="url(#buildingGradient1)" />
    <!-- 咖啡馆窗户 -->
    <rect x="170" y="50" width="30" height="40" fill="#f0e6d2" />
    <rect x="210" y="50" width="30" height="40" fill="#f0e6d2" />
    <!-- 咖啡手势木牌 -->
    <rect x="190" y="20" width="20" height="20" fill="#d9b38c" />
    <!-- 咖啡手势 -->
    <path d="M195,25 Q200,30 205,25" stroke="#666666" stroke-width="1" fill="none" />
    <path d="M195,27 Q200,32 205,27" stroke="#666666" stroke-width="1" fill="none" />
  </g>
  
  <!-- 篇章二：温馨住宅与便利店（画面中上部） -->
  <g transform="translate(800, 300)" filter="url(#blur)">
    <!-- 住宅 -->
    <rect x="-100" y="50" width="150" height="120" fill="url(#buildingGradient2)" />
    <!-- 住宅窗户 -->
    <rect x="-80" y="70" width="30" height="30" fill="#f0d4b0" />
    <rect x="-40" y="70" width="30" height="30" fill="#f0d4b0" />
    <rect x="-80" y="110" width="30" height="30" fill="#f0d4b0" />
    <rect x="-40" y="110" width="30" height="30" fill="#f0d4b0" />
    <!-- 住宅门 -->
    <rect x="-20" y="130" width="20" height="40" fill="#d9b38c" />
    
    <!-- 窗户里的一家人 -->
    <circle cx="-65" cy="85" r="8" fill="#f0d4b0" />
    <circle cx="-25" cy="85" r="8" fill="#f0d4b0" />
    <circle cx="-45" cy="105" r="8" fill="#f0d4b0" />
    
    <!-- 门口的人 - 比"欢迎"手势 -->
    <circle cx="-10" cy="120" r="10" fill="#f0d4b0" />
    <rect x="-15" y="130" width="10" height="15" fill="#f0d4b0" />
    <!-- 欢迎手势 -->
    <path d="M-10,135 Q0,145 10,135" stroke="#f0d4b0" stroke-width="2" fill="none" />
    
    <!-- 便利店 -->
    <rect x="60" y="70" width="100" height="100" fill="url(#buildingGradient1)" />
    <!-- 便利店窗户 -->
    <rect x="70" y="90" width="25" height="25" fill="#f0e6d2" />
    <rect x="105" y="90" width="25" height="25" fill="#f0e6d2" />
    <!-- 便利店招牌 -->
    <rect x="70" y="50" width="60" height="20" fill="#f9e6c9" />
    <!-- 谢谢手势符号 -->
    <path d="M100,55 Q105,60 110,55" stroke="#666666" stroke-width="1" fill="none" />
    <path d="M100,57 Q105,62 110,57" stroke="#666666" stroke-width="1" fill="none" />
  </g>
  
  <!-- 街道上的点缀人物 -->
  <g filter="url(#blur)">
    <!-- 邮差 -->
    <circle cx="400" cy="550" r="10" fill="#f0d4b0" />
    <rect x="395" y="560" width="10" height="15" fill="#f0d4b0" />
    <!-- 打招呼手势 -->
    <path d="M400,565 Q410,570 415,565" stroke="#f0d4b0" stroke-width="1.5" fill="none" />
    
    <!-- 孩子 -->
    <circle cx="700" cy="580" r="8" fill="#f0d4b0" />
    <rect x="696" y="588" width="8" height="12" fill="#f0d4b0" />
    <!-- 指着花的手势 -->
    <path d="M700,590 Q710,595 715,590" stroke="#f0d4b0" stroke-width="1.5" fill="none" />
    
    <!-- 花朵 -->
    <circle cx="730" cy="600" r="5" fill="#f9e6c9" />
    <circle cx="725" cy="595" r="3" fill="#f9e6c9" />
    <circle cx="735" cy="595" r="3" fill="#f9e6c9" />
    <circle cx="725" cy="605" r="3" fill="#f9e6c9" />
    <circle cx="735" cy="605" r="3" fill="#f9e6c9" />
  </g>
  
  <!-- 街道上的星光/石板路效果 -->
  <g opacity="0.6">
    <circle cx="100" cy="600" r="3" fill="#ffffff" />
    <circle cx="200" cy="580" r="2" fill="#ffffff" />
    <circle cx="300" cy="600" r="3" fill="#ffffff" />
    <circle cx="400" cy="610" r="2" fill="#ffffff" />
    <circle cx="500" cy="600" r="3" fill="#ffffff" />
    <circle cx="600" cy="590" r="2" fill="#ffffff" />
    <circle cx="700" cy="600" r="3" fill="#ffffff" />
    <circle cx="800" cy="610" r="2" fill="#ffffff" />
    <circle cx="900" cy="600" r="3" fill="#ffffff" />
    <circle cx="1000" cy="590" r="2" fill="#ffffff" />
    <circle cx="1100" cy="600" r="3" fill="#ffffff" />
  </g>
</svg>