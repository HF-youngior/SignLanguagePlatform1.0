    <line x1="8" y1="15" x2="12" y2="18" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="-5" y1="20" x2="-8" y2="28" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="5" y1="20" x2="8" y2="28" stroke="#e6d8c8" stroke-width="2"/>
