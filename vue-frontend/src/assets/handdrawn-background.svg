    <circle r="12" fill="#f0e6d8" stroke="#e6d8c8" stroke-width="1"/>
    <line x1="0" y1="12" x2="0" y2="25" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="-10" y1="18" x2="-15" y2="22" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="10" y1="18" x2="15" y2="22" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="-8" y1="25" x2="-12" y2="35" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="8" y1="25" x2="12" y2="35" stroke="#e6d8c8" stroke-width="2"/>
