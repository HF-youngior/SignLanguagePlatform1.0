    <line x1="30" y1="27" x2="35" y2="25" stroke="#b8a79e" stroke-width="1"/>
    <line x1="30" y1="43" x2="35" y2="45" stroke="#b8a79e" stroke-width="1"/>
    <line x1="30" y1="35" x2="38" y2="35" stroke="#b8a79e" stroke-width="1"/>
    <!-- 狗绳 -->
