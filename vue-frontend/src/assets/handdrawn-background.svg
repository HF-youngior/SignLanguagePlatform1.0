  <path d="M600,180 Q650,140 700,180 Q750,220 800,180 Q850,140 900,180" fill="#ffffff" stroke="#f0f0f0" stroke-width="2"/>
  
  <!-- 道路 -->
  <path d="M200,800 Q600,700 1000,800 Q1050,900 1000,1000 Q600,900 200,1000 Q150,900 200,800" fill="#e8ddd0" stroke="#d9c9b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M400,600 Q600,550 800,600" fill="none" stroke="#e8ddd0" stroke-width="30" stroke-linecap="round"/>
  <path d="M400,1200 Q600,1150 800,1200" fill="none" stroke="#e8ddd0" stroke-width="30" stroke-linecap="round"/>
  
  <!-- 中心公园区（地图中下部） -->
