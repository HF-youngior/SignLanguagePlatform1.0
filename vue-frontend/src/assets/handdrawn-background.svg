    <circle r="10" fill="#f0e6d8" stroke="#e6d8c8" stroke-width="1"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="-8" y1="15" x2="-12" y2="18" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="8" y1="15" x2="12" y2="18" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="-5" y1="20" x2="-8" y2="28" stroke="#e6d8c8" stroke-width="2"/>
    <line x1="5" y1="20" x2="8" y2="28" stroke="#e6d8c8" stroke-width="2"/>
  </g>
  
  <g transform="translate(390, 480)">
