    <line x1="-10" y1="35" x2="10" y2="35" stroke="#e0e0e0" stroke-width="2"/>
    <line x1="0" y1="25" x2="0" y2="35" stroke="#e0e0e0" stroke-width="2"/>
  </g>
  
  <!-- 牵着狗并用手语对狗发出指令的行人 -->
