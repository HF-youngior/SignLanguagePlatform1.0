  <line x1="300" y1="550" x2="300" y2="600" stroke="#c4b3a8" stroke-width="3"/>
  
  <circle cx="900" cy="550" r="30" fill="#f3f8f3" stroke="#eaf4ea" stroke-width="2"/>
  <line x1="900" y1="550" x2="900" y2="600" stroke="#c4b3a8" stroke-width="3"/>
  
  <circle cx="300" cy="1050" r="30" fill="#f3f8f3" stroke="#eaf4ea" stroke-width="2"/>
  <line x1="300" y1="1050" x2="300" y2="1100" stroke="#c4b3a8" stroke-width="3"/>
  
  <circle cx="900" cy="1050" r="30" fill="#f3f8f3" stroke="#eaf4ea" stroke-width="2"/>
  <line x1="900" y1="1050" x2="900" y2="1100" stroke="#c4b3a8" stroke-width="3"/>
